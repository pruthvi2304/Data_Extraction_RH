# Development-only NATS TLS and NKey configuration.
# The NKey public identity is loaded from certs/nats/user.public by docker-compose.
port: 4222
http_port: 8222
server_name: plant-nats-development

tls {
  cert_file: "/etc/nats/certs/nats/server.crt"
  key_file: "/etc/nats/certs/nats/server.key"
  ca_file: "/etc/nats/certs/nats/ca.crt"
  verify: false
  timeout: 2
}

authorization {
  users = [
    {
      nkey: $NATS_USER_NKEY
      permissions: {
        publish: { allow: ["qs.>"] }
      }
    }
  ]
}

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 256MB
  max_file_store: 2GB
}
