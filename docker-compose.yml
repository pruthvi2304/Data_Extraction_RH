services:
  plant-nats:
    image: nats:2.10-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export NATS_USER_NKEY="$$(tr -d '\r\n' < /etc/nats/certs/nats/user.public)"
        test -n "$$NATS_USER_NKEY"
        exec nats-server -c /etc/nats/nats-server.conf -js
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./certs:/etc/nats/certs:ro
      - plant-nats-data:/data/jetstream
volumes:
  plant-nats-data:
